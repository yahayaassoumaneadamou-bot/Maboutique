<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Ma Boutique</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>⚙️ Espace Admin</h1>
  <nav><a href="index.html">Voir la boutique</a></nav>
</header>

<div class="container">

  <div class="section">
    <h2>Ajouter un produit</h2>
    <div class="card" style="max-width:400px;">
      <input id="nouveau-nom" placeholder="Nom du produit">
      <input id="nouveau-prix" type="number" placeholder="Prix (€)">
      <input id="nouveau-stock" type="number" placeholder="Stock">
      <button class="btn-primary" onclick="ajouterProduitAdmin()">Ajouter</button>
    </div>
  </div>

  <div class="section">
    <h2>Produits</h2>
    <table>
      <thead><tr><th>Nom</th><th>Prix</th><th>Stock</th><th>Action</th></tr></thead>
      <tbody id="table-produits"><tr><td colspan="4" class="vide">Chargement...</td></tr></tbody>
    </table>
  </div>

  <div class="section">
    <h2>Commandes reçues</h2>
    <table>
      <thead><tr><th>Client</th><th>Articles</th><th>Total</th><th>Date</th><th>Statut</th><th>Action</th></tr></thead>
      <tbody id="table-commandes"><tr><td colspan="6" class="vide">Chargement...</td></tr></tbody>
    </table>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="data.js"></script>
<script>

  function afficherProduitsAdmin(produits) {
    const tbody = document.getElementById("table-produits");
    tbody.innerHTML = "";

    if (produits.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="vide">Aucun produit</td></tr>';
      return;
    }

    produits.forEach(p => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${p.nom}</td>
        <td>${p.prix} €</td>
        <td>${p.stock}</td>
        <td><button class="btn-danger" onclick="supprimerProduitAdmin('${p.id}')">Supprimer</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function ajouterProduitAdmin() {
    const nom = document.getElementById("nouveau-nom").value.trim();
    const prix = parseFloat(document.getElementById("nouveau-prix").value);
    const stock = parseInt(document.getElementById("nouveau-stock").value);

    if (!nom || isNaN(prix) || isNaN(stock)) {
      alert("Merci de remplir tous les champs correctement.");
      return;
    }

    await ajouterProduit({ nom, prix, stock });

    document.getElementById("nouveau-nom").value = "";
    document.getElementById("nouveau-prix").value = "";
    document.getElementById("nouveau-stock").value = "";
  }

  async function supprimerProduitAdmin(id) {
    if (!confirm("Supprimer ce produit ?")) return;
    await supprimerProduit(id);
  }

  function afficherCommandesAdmin(commandes) {
    const tbody = document.getElementById("table-commandes");
    tbody.innerHTML = "";

    if (commandes.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="vide">Aucune commande</td></tr>';
      return;
    }

    commandes.forEach(c => {
      const articles = c.articles.map(a => `${a.nom} ×${a.quantite}`).join(", ");
      const badgeClass = c.statut === "livrée" ? "badge livree" : "badge";
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${c.client}</td>
        <td>${articles}</td>
        <td>${c.total} €</td>
        <td>${c.date}</td>
        <td><span class="${badgeClass}">${c.statut}</span></td>
        <td>${c.statut !== "livrée" ? `<button class="btn-secondary" onclick="marquerLivreeAdmin('${c.id}')">Marquer livrée</button>` : "—"}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function marquerLivreeAdmin(id) {
    await marquerLivree(id);
  }

  ecouterProduits(afficherProduitsAdmin);
  ecouterCommandes(afficherCommandesAdmin);
</script>

</body>
</html>
