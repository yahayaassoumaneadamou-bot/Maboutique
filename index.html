<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Boutique</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🛍️ Ma Boutique</h1>
  <nav><a href="admin.html">Espace Admin</a></nav>
</header>

<div class="container">
  <div class="section">
    <h2>Nos produits</h2>
    <div id="grille-produits" class="grid"><div class="vide">Chargement...</div></div>
  </div>

  <div class="panier">
    <h2>🧺 Panier</h2>
    <div id="lignes-panier"></div>
    <div class="ligne" style="font-weight:700; border:none;">
      <span>Total</span>
      <span id="total-panier">0 €</span>
    </div>
    <br>
    <input id="nom-client" placeholder="Votre nom">
    <button class="btn-primary" onclick="passerCommande()">Valider la commande</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="data.js"></script>
<script>
  let panier = []; // { id, nom, prix, quantite }
  let produitsActuels = [];

  function afficherProduits(produits) {
    produitsActuels = produits;
    const grille = document.getElementById("grille-produits");
    grille.innerHTML = "";

    if (produits.length === 0) {
      grille.innerHTML = '<div class="vide">Aucun produit disponible pour le moment.</div>';
      return;
    }

    produits.forEach(p => {
      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <h3>${p.nom}</h3>
        <div class="prix">${p.prix} € · stock: ${p.stock}</div>
        <button class="btn-primary" ${p.stock <= 0 ? "disabled" : ""} onclick="ajouterAuPanier('${p.id}')">
          ${p.stock <= 0 ? "Rupture de stock" : "Ajouter au panier"}
        </button>
      `;
      grille.appendChild(div);
    });
  }

  function ajouterAuPanier(id) {
    const produit = produitsActuels.find(p => p.id === id);
    if (!produit) return;

    const ligne = panier.find(l => l.id === id);
    if (ligne) {
      ligne.quantite++;
    } else {
      panier.push({ id: produit.id, nom: produit.nom, prix: produit.prix, quantite: 1 });
    }
    afficherPanier();
  }

  function retirerDuPanier(id) {
    panier = panier.filter(l => l.id !== id);
    afficherPanier();
  }

  function afficherPanier() {
    const zone = document.getElementById("lignes-panier");
    zone.innerHTML = "";
    let total = 0;

    if (panier.length === 0) {
      zone.innerHTML = '<div class="vide">Panier vide</div>';
    }

    panier.forEach(l => {
      total += l.prix * l.quantite;
      const div = document.createElement("div");
      div.className = "ligne";
      div.innerHTML = `
        <span>${l.nom} × ${l.quantite}</span>
        <span>${l.prix * l.quantite} € <button class="btn-secondary" onclick="retirerDuPanier('${l.id}')">✕</button></span>
      `;
      zone.appendChild(div);
    });

    document.getElementById("total-panier").textContent = total + " €";
  }

  async function passerCommande() {
    const nomClient = document.getElementById("nom-client").value.trim();

    if (panier.length === 0) {
      alert("Votre panier est vide.");
      return;
    }
    if (!nomClient) {
      alert("Merci d'indiquer votre nom.");
      return;
    }

    // Vérifier le stock
    for (const ligne of panier) {
      const produit = produitsActuels.find(p => p.id === ligne.id);
      if (!produit || produit.stock < ligne.quantite) {
        alert(`Stock insuffisant pour ${ligne.nom}.`);
        return;
      }
    }

    // Déduire le stock de chaque produit
    for (const ligne of panier) {
      const produit = produitsActuels.find(p => p.id === ligne.id);
      await modifierStock(produit.id, produit.stock - ligne.quantite);
    }

    // Enregistrer la commande
    await ajouterCommande({
      client: nomClient,
      articles: panier,
      total: panier.reduce((s, l) => s + l.prix * l.quantite, 0),
      statut: "en attente",
      date: new Date().toLocaleString("fr-FR"),
    });

    alert("Commande envoyée, merci !");
    panier = [];
    document.getElementById("nom-client").value = "";
    afficherPanier();
  }

  initialiserProduitsDemo().then(() => {
    ecouterProduits(afficherProduits);
  });
  afficherPanier();
</script>

</body>
</html>
